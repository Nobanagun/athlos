repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && uv run mypy'
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        # frontend/mobile/package-lock.json (~586KB) is a legitimate,
        # necessary lockfile - same category as backend/uv.lock, already
        # committed. Raised from the 500KB default rather than excluding
        # lockfiles outright, so a genuinely oversized accidental commit
        # still gets caught.
        args: [--maxkb=1000]
