[project]
name = "athlos-backend"
version = "0.1.0"
description = "Athlos backend - modular monolith (DDD) for multi-sport training, recovery, planning and AI coaching."
requires-python = ">=3.13"
readme = "README.md"

# Versiones verificadas contra PyPI el 2026-07-19 (ver docs/DECISIONS.md).
# Pin con `~=` (compatible release): permite parches, bloquea cambios de minor.
dependencies = [
    "fastapi~=0.139.2",
    "uvicorn[standard]~=0.51.0",
    "sqlalchemy~=2.0.51",
    "alembic~=1.18.5",
    "psycopg[binary,pool]~=3.3.4",
    "redis~=8.0.1",
    "pydantic~=2.13.4",
]

[dependency-groups]
dev = [
    "pytest~=9.1.1",
    "httpx2~=2.7.0",
    "ruff~=0.15.22",
    "mypy~=2.3.0",
    "pre-commit~=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/athlos"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
